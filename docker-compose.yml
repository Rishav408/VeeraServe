name: veeraserve

# LM Studio is a desktop application and runs on the HOST, not in a container.
# The backend reaches it via LLM_BASE_URL (default: http://host.docker.internal:1234/v1).

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: docker
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LLM_BASE_URL: http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - chroma

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/data

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veeraserve
      POSTGRES_PASSWORD: veeraserve
      POSTGRES_DB: veeraserve
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  chroma-data:
  db-data:
